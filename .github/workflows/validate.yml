name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh

      - name: Upstream pin consistency
        run: ./scripts/sync-source.sh --check

      - name: Markdown links
        run: python3 scripts/check-links.py
